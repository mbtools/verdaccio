storage: ./storage

auth:
  htpasswd:
    file: ./htpasswd-package-web-token

web:
  enable: true
  title: verdaccio

publish:
  allow_offline: false

uplinks:

log: { type: stdout, format: pretty, level: trace }

packages:
  '@*/*':
    access: $authenticated
    publish: $authenticated # apm
  '**':
    access: $authenticated
    publish: $authenticated # apm
_debug: true
